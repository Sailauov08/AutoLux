services:
  - type: web
    name: autolux
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /kk
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_DEALERSHIP_SLUG
        value: autolux
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
